name: Smoke test

# Starts a real dedicated server with the mod, generates part of the Wyvern Lair, spawns the
# mod's creatures (tools/smoke-commands.txt), lets them live for a while, kills them, and
# reports errors from the server log.
on:
  push:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the server
        run: |
          chmod +x gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-seed=menagerie\n' > run/server.properties
          mkfifo /tmp/console
          (./gradlew --no-daemon runServer < /tmp/console > /tmp/server.log 2>&1; echo "SERVER EXITED $?" >> /tmp/server.log) &
          exec 3>/tmp/console
          for i in $(seq 1 300); do
            grep -q 'Done (' /tmp/server.log && break
            grep -q 'SERVER EXITED' /tmp/server.log && break
            sleep 2
          done
          if grep -q 'Done (' /tmp/server.log; then
            grep -v '^#' tools/smoke-commands.txt | while read -r cmd; do
              [ -z "$cmd" ] && continue
              echo "$cmd" >&3
              sleep 2
            done
            sleep 45
            echo "kill @e[type=!minecraft:player,type=!minecraft:item]" >&3
            sleep 5
            echo "stop" >&3
          fi
          exec 3>&-
          wait || true
          echo "================ problems ================"
          # "No data fixer registered" is logged for every modded entity in a development run; it is harmless.
          grep -v 'No data fixer registered' /tmp/server.log > /tmp/server-filtered.log
          grep -nE 'ERROR|Exception|Caused by|Failed to|Couldn.t|Unknown|WARN.*(menagerie|Menagerie)' /tmp/server-filtered.log | grep -v 'Unknown or incomplete command' | head -150 || true
          echo "================ summary ================"
          grep -nE 'Done \(|Summoned|Killed|Added ticket|Saving|SERVER EXITED' /tmp/server.log | head -60 || true
          grep -q 'Done (' /tmp/server.log || { echo "Server did not start"; tail -120 /tmp/server.log; exit 1; }
          if grep -qE 'ERROR|Exception' /tmp/server-filtered.log; then exit 1; fi
